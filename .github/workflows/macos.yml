name: macOS

on:
  push:
    paths:
      - "apps/macos/**"
      - "scripts/build-poc-app.sh"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "apps/macos/**"
      - "scripts/build-poc-app.sh"
      - ".github/workflows/macos.yml"

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --package-path apps/macos
      - name: Core behavior checks
        run: swift run --package-path apps/macos TrimletCoreChecks
