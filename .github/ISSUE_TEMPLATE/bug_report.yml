name: Bug report
description: Report reproducible Trimlet behavior without attaching private media.
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["macOS", "Windows", "Shared contract"]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic media or describe stream properties. Do not upload private video.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private paths, personal media, and secrets.
          required: true
