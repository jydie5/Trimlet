name: 機能のリクエスト / Feature request
description: できるようになってほしいことを教えてください。Tell us what you want to do.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: 対象 / Platform
      options: ["Windows", "macOS", "両方 / Both", "わからない / Unsure"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: いま困っていること / What is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: できるようになってほしいこと / Desired result
    validations:
      required: true
